name: CI Pipeline

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.14'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    env:
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run unit tests
        run: |
          pytest --cov=app --cov-report=xml

  security_scans:
    name: Security Scans (SAST / SCA)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Run OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: .
          format: ALL
          out: reports
          args: >
            --failOnCVSS 7
            --enableRetired 

  # NOTIFICATION: Pipeline Status (main branch only)
  notify_pipeline_status:
    name: Notify Stakeholders
    runs-on: ubuntu-latest
    needs: [security_scans]  
    if: always() && github.ref_name == 'main'  # Always run on main, regardless of job outcomes
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PIPELINE }}
          status: ${{ needs.security_scans.result }} 
          title: CI Pipeline
          description: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          color: ${{ needs.security_scans.result == 'success' && '0x00FF00' || '0xFF0000' }}
          username: CI Pipeline Bot

  # NOTIFICATION: Dev Alerts (feature and main branches)
  notify_dev_alerts:
    name: Notify Dev Alerts
    runs-on: ubuntu-latest
    needs: [test]
    if: (startsWith(github.ref_name, 'feature/') || github.ref_name == 'main') && needs.test.result == 'failure'  
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          status: ${{ needs.test.result }}
          title: Unit Tests Failed
          description: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
          color: 0xFFFF00 
          username: Dev Alert Bot

  # NOTIFICATION: Security Alerts (feature and main branches)
  notify_security_alerts:
    name: Notify Security Alerts
    runs-on: ubuntu-latest
    needs: [security_scans] 
    if: (startsWith(github.ref_name, 'feature/') || github.ref_name == 'main') && needs.security_scans.result == 'failure' 
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}
          status: ${{ needs.security_scans.result }}
          title: Security Scan Alert
          description: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Alert: CodeQL or Dependency-Check found vulnerabilities
          color: 0xFF0000  
          username: Security Alert Bot
