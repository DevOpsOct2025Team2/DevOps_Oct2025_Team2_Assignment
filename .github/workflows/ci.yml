name: CI Pipeline

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main, staging,'feature/*', 'ci/*']
  pull_request:
    branches: [main, staging, 'feature/*', 'ci/*']

env:
  PYTHON_VERSION: '3.14'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov flake8
      
      - name: Run linting
        run: flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics

  lint-frontend:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install ESLint
        run: npm install -g eslint

      - name: Run frontend linting
        run: eslint app/static/js/ --max-warnings 0

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, lint-frontend]
    env:
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run unit tests
        run: |
          pytest --cov=app --cov-report=xml

  security_scans:
    name: Security Scans (SAST / SCA)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: Run OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: ${{ github.repository }}
          path: .
          format: ALL
          out: reports
          args: >
            --failOnCVSS 7
            --enableRetired 

  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test, security_scans]

    # Deploy to staging on any branch except main
    if: github.ref != 'refs/heads/main'

    environment: 
      name: Staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger deployment to staging
        run: |
          gh workflow run publish-ghcr.yml --ref ${{ github.ref }}
        env:
          GH_TOKEN: ${{ github.token }}

  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test, security_scans]
    if: github.ref == 'refs/heads/main'

    environment: 
      name: Production

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Trigger deployment to production
        run: |
          gh workflow run publish-ghcr.yml --ref ${{ github.ref }}
        env:
          GH_TOKEN: ${{ github.token }}

  # NOTIFICATION: Pipeline Status (main branch only)
  notify_pipeline_status:
    name: Notify Stakeholders
    runs-on: ubuntu-latest
    needs: [lint, test, security_scans]  
    if: always() && github.ref_name == 'main'  # Always run on main, regardless of job outcomes
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_PIPELINE }}
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          title: CI Pipeline
          description: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Lint: ${{ needs.lint.result }}
            Tests: ${{ needs.test.result }}
            Security Scans: ${{ needs.security_scans.result }}
          color: ${{ contains(needs.*.result, 'failure') && '0xFF0000' || '0x00FF00' }}
          username: CI Pipeline Bot

  # NOTIFICATION: Dev Alerts (all branches)
  notify_dev_alerts:
    name: Notify Dev Alerts
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && needs.test.result == 'failure'
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          status: ${{ needs.test.result }}
          title: Unit Tests Failed
          description: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
          color: 0xFFFF00 
          username: Dev Alert Bot

  # NOTIFICATION: Security Alerts (all branches)
  notify_security_alerts:
    name: Notify Security Alerts
    runs-on: ubuntu-latest
    needs: [security_scans] 
    if: always() && needs.security_scans.result == 'failure'
    steps:
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SECURITY }}
          status: ${{ needs.security_scans.result }}
          title: Security Scan Alert
          description: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Alert: CodeQL or Dependency-Check found vulnerabilities
          color: 0xFF0000  
          username: Security Alert Bot
