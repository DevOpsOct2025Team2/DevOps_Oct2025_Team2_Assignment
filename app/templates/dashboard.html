{% extends "layout.html" %}
{% set title = "Dashboard" %}
{% set page = "dashboard" %}
{% block content %}
  <main class="page-shell">
    <section class="card page-card">
      <span class="badge">Regular</span>
      <h1>Dashboard</h1>
      <p class="lead">
        You are signed in as <strong>{{ user.username }}</strong>.
      </p>
      <p class="muted">
        This space is reserved for your day-to-day workflows and updates.
      </p>
      <div class="actions">
        <a class="ghost" href="/logout">Log out</a>
      </div>
    </section>
  </main>
{% endblock %}
