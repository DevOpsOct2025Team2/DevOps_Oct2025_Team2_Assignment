name: Build and Publish Backend + Frontend (GHCR)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            us-central1-docker.pkg.dev/devpopsoct2025team2/backend-repo/devops-backend:${{ github.sha }}
            us-central1-docker.pkg.dev/devpopsoct2025team2/backend-repo/devops-backend:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            ghcr.io/${{ github.repository_owner }}/devops-oct2025-team2-assignment-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devops-oct2025-team2-assignment-backend:${{ github.ref_name == 'main' && 'latest' || 'staging' }}
            ghcr.io/${{ github.repository_owner }}/devops-oct2025-team2-assignment-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/devops-oct2025-team2-assignment-frontend:${{ github.ref_name == 'main' && 'latest' || 'staging' }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy app \
            --quiet \
            --image us-central1-docker.pkg.dev/devpopsoct2025team2/backend-repo/devops-backend:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --port 5000 \
            --allow-unauthenticated \
            --set-env-vars SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            
