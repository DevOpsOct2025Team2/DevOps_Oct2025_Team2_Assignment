name: CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.14'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code Quality and Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run unit tests
        run: |
          pytest --cov=app --cov-report=xml

  security_scans:
    name: Security Scans (SAST / SCA)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@main
        with:
          languages: python

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@main

      - name: Run OWASP Dependency-Check (SCA)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: DevOps-Assignment
          path: .
          format: HTML
          out: reports

  notify_pipeline_status:
    name: Notify Stakeholders
    runs-on: ubuntu-latest
    needs: [security_scans]
    if:  github.ref_name == 'main'
    steps:
      - name: Notify success to stakeholders
        if: needs.security_scans.result == 'success'
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
          \"content\": \"🟢 CI PIPELINE STATUS\nResult: PASSED ✅\nBranch: ${GITHUB_REF_NAME}\nCommit: ${GITHUB_SHA}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nThe system is healthy and ready for use.\"
          }" \
          ${{ secrets.DISCORD_WEBHOOK_PIPELINE }}

      - name: Notify failure to stakeholders
        if: needs.security_scans.result == 'failure'
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
          \"content\": \"🔴 CI PIPELINE STATUS\nResult: FAILED ❌\nBranch: ${GITHUB_REF_NAME}\nCommit: ${GITHUB_SHA}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nThe development team has been notified and is currently investigating the issue.\nFurther updates will be provided once resolved.\"
          }" \
          ${{ secrets.DISCORD_WEBHOOK_PIPELINE }}

  notify_dev_alerts:
    name: Notify Dev Alerts
    runs-on: ubuntu-latest
    needs: [security_scans]
    if: startsWith(github.ref_name, 'feature/') && needs.security_scans.result == 'failure'

    steps:
      - name: Notify developers of test failure
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
          \"content\": \"🔴 CI FAILED: UNIT TESTS\nBranch: ${GITHUB_REF_NAME}\nCommit: ${GITHUB_SHA}\nTriggered by: ${GITHUB_ACTOR}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nPlease investigate and fix the failing tests.\"
          }" \
          ${{ secrets.DISCORD_WEBHOOK_DEV }}

  notify_security_alerts:
    name: Notify Security Alerts
    runs-on: ubuntu-latest
    needs: [security_scans]
    if: needs.security_scans.result == 'failure'
    steps:
      - name: Notify security channel 
        run: |
                curl -H "Content-Type: application/json" \
                -d "{
                \"content\": \"⚠️ SECURITY ALERT\nBranch: ${GITHUB_REF_NAME}\nCommit: ${GITHUB_SHA}\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\nStatic and dependency security scans have detected potential vulnerabilities. Please review the scan results.\"
                }" \
                ${{ secrets.DISCORD_WEBHOOK_SECURITY }}
