name: Build and Publish Backend to GHCR (Staging)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build, scan and publish to staging
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to staging
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/devopsoct2025team2/devops-oct2025-team2-assignment-backend:${{ github.sha }}
            ghcr.io/devopsoct2025team2/devops-oct2025-team2-assignment-backend:latest

