name: Build and Publish Backend + Frontend to GHCR (Staging) 

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build, scan and publish to staging
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to staging
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/devopsoct2025team2/devops-oct2025-team2-assignment-backend:${{ github.sha }}
            ghcr.io/devopsoct2025team2/devops-oct2025-team2-assignment-backend:staging
    
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy devops-oct2025-backend-staging \
            --quiet \
            --image ghcr.io/devopsoct2025team2/devops-oct2025-team2-assignment-backend:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --port 5000 \
            --allow-unauthenticated \
            --set-env-vars SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
